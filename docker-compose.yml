# School Admission system: PostgreSQL + API + web frontend.
#
#   docker compose up --build        web app on http://localhost:3000, API on http://localhost:8080
#                                    (Swagger UI at /swagger, health at /health)
#   docker compose down              stop, keep the data
#   docker compose down -v           stop and DELETE the database volume
#
# Every ${VAR:-default} below can be overridden from a .env file next to this file (copy .env.example)
# or from the shell. With no .env at all the defaults below are used, so a plain `up --build` works.

name: school-admission

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-school_admission}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      # Named volume: the data survives `docker compose down` and container re-creation.
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # $$ is escaped for Compose; the container's shell expands the variables.
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    # Not published to the host on purpose: only the API needs it, over the compose network.
    # To inspect the data:  docker compose exec postgres psql -U postgres -d school_admission
    # To reach it from the host instead, add:  ports: ["5432:5432"]

  backend:
    build:
      context: ./backend             # backend/ holds src/Domain, src/Infrastructure and src/Api, which the Dockerfile needs
      dockerfile: Dockerfile
    image: school-admission-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy   # wait until Postgres accepts connections, then migrate and serve
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Built from the POSTGRES_* values above so the two can never disagree. "postgres" is the service name.
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-school_admission};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}"
      HOLD_DURATION_SECONDS: ${HOLD_DURATION_SECONDS:-600}
      HOLD_EXPIRY_SWEEP_ENABLED: ${HOLD_EXPIRY_SWEEP_ENABLED:-true}
      HOLD_EXPIRY_SWEEP_INTERVAL_SECONDS: ${HOLD_EXPIRY_SWEEP_INTERVAL_SECONDS:-5}
      # Browser origins allowed to call the API (CORS): the frontend's Vite dev (5173) and preview (4173) servers,
      # and the frontend container below (http://localhost:3000, or whatever FRONTEND_PORT is set to).
      # Note "-" and not ":-": the default applies only when the variable is UNSET, so CORS_ALLOWED_ORIGINS= (empty)
      # in .env really means "no origin" (CORS off) instead of silently falling back to these three.
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS-http://localhost:5173,http://localhost:4173,http://localhost:${FRONTEND_PORT:-3000}}"
    ports:
      - "${API_PORT:-8080}:8080"

  frontend:
    build:
      context: ./frontend            # the Dockerfile's last stage (nginx) is what is built here; its test stage is not run by `up`
      dockerfile: Dockerfile
    image: school-admission-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy   # the backend image's own HEALTHCHECK on /health
    environment:
      # Where the BROWSER finds the API. The browser makes the API calls, not this container, so this must be
      # a URL the user's browser can reach: the published port, never http://backend:8080 (a name only
      # containers can resolve). It follows API_PORT, so changing the published API port keeps them in step.
      API_BASE_URL: "${API_BASE_URL:-http://localhost:${API_PORT:-8080}}"
    ports:
      - "${FRONTEND_PORT:-3000}:80"

volumes:
  postgres_data:
