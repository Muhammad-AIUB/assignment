server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Runtime configuration, written at container start by
    # docker-entrypoint.d/40-runtime-config.sh. Never cached (a changed API_BASE_URL must
    # apply on the next load) and never answered with index.html: a missing config.js
    # has to be a 404 the app can report, not an HTML page that fails to parse as script.
    location = /config.js {
        add_header Cache-Control "no-store" always;
        try_files /config.js =404;
    }

    # Vite names built files by content hash, so they can be cached for good.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Single-page app: any other path is a client-side route, so serve index.html. This is
    # what makes a refresh on /holds/h_123 or /me work instead of returning 404.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
